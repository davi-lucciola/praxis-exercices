[project]
name = "prax-ex-01"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.7.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.3",
    "pytest-sugar>=1.1.1",
    "ruff>=0.11.11",
    "taskipy>=1.14.1",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT", "B"]
ignore = ["B008", "PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.ruff.format]
preview = true
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "unit: unit tests (tests/unit)",
    "integration: integration tests (tests/integration)",
    "infra: infrastructure layer",
    "health: health endpoint",
]

[tool.taskipy.tasks]
lint = "ruff check"
format = "ruff format"
dev = "uv run --env-file .env fastapi dev app/main.py --host 0.0.0.0 --port 8000"
test = "task test_unit && task test_integration"
pre_test = "task lint"
test_unit = "uv run --env-file .env pytest tests/unit -x"
test_integration = "uv run --env-file .env pytest tests/integration -x"
pre_format = "ruff check --fix"
